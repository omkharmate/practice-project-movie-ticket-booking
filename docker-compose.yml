version: '3.8'

services:
  redis:
    image: redis:7
    ports:
      - "6379:6379"

  booking-service:
    image: mysql:8.0
    container_name: booking-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: booking_db
    ports:
      - "3309:3306"
    volumes:
      - booking_mysql_data:/var/lib/mysql

  movie-mysql:
    image: mysql:8.0
    container_name: movie-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: movie_db
    ports:
      - "3307:3306"
    volumes:
      - movie_mysql_data:/var/lib/mysql

  theatre-mysql:
    image: mysql:8.0
    container_name: theatre-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: theatre_db
    ports:
      - "3308:3306"
    volumes:
      - theatre_mysql_data:/var/lib/mysql

  prometheus:
    image: prom/prometheus
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - monitoring

  grafana:
    image: grafana/grafana
    container_name: grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - monitoring

volumes:
  movie_mysql_data:
  theatre_mysql_data:
  booking_mysql_data:

networks:
  monitoring:
    name: monitoring