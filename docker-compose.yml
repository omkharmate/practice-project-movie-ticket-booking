version: '3.8'

services:
  booking-service:
    image: mysql:8.0
    container_name: booking-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: booking_db
    ports:
      - "3309:3306"
    volumes:
      - booking_mysql_data:/var/lib/mysql

  movie-mysql:
    image: mysql:8.0
    container_name: movie-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: movie_db
    ports:
      - "3307:3306"
    volumes:
      - movie_mysql_data:/var/lib/mysql

  theatre-mysql:
    image: mysql:8.0
    container_name: theatre-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: theatre_db
    ports:
      - "3308:3306"
    volumes:
      - theatre_mysql_data:/var/lib/mysql

volumes:
  movie_mysql_data:
  theatre_mysql_data:
  booking_mysql_data: